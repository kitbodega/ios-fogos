name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: FOGOS
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      shim_only:
        description: build only the Linux FOGOS shim artifact
        type: boolean
        default: false
      kernel_run_id:
        description: successful FOGOS kernel workflow run whose artifact to package
        default: "41405380749"
      boot_args:
        description: boot arguments (fogos-rw=1 enables UFS/root writes; fogos-ufs-probe=1 is read-only)
        default: "debug=0xc serial=3 cpus=1 keepsyms=1"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}-${{ inputs.shim_only == true && 'shim' || 'kernel' }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'FOGOS' }}

permissions:
  actions: read
  contents: read

jobs:
  fogos-shim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOGOS_BOOT_ARGS: ${{ inputs.boot_args || 'debug=0xc serial=3 cpus=1 keepsyms=1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          repository: kitbodega/ios-fogos
          run-id: ${{ inputs.kernel_run_id || '41405380749' }}
          github-token: ${{ github.token }}
          path: research/fogos-ci/kernel
      - name: Create FOGOS ADT and payload
        run: |
          mkdir -p dtb shim/out
          python3 tools/mkadt.py dtb/fogos-moto-g34.adt --fogos
          python3 tools/mkpayload.py \
            research/fogos-ci/kernel/kernel.development.fogos \
            dtb/fogos-moto-g34.adt shim/out/fogos-payload.bin --fogos \
            --cmdline "$FOGOS_BOOT_ARGS"
      - name: Build no-framebuffer FOGOS boot image
        run: bash shim/build.sh --fogos shim/out/fogos-payload.bin
      - name: Verify v3 package and embedded payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          image = Path('shim/out/fogos-boot.img').read_bytes()
          kernel = Path('shim/out/Image').read_bytes()
          assert image[:8] == b'ANDROID!'
          kernel_size, ramdisk_size = struct.unpack_from('<II', image, 8)
          assert struct.unpack_from('<I', image, 40)[0] == 3
          assert struct.unpack_from('<I', image, 20)[0] == 1580
          assert kernel_size == len(kernel)
          assert kernel[56:60] == b'ARMd'
          assert kernel[64:].find(b'FOGOSXNU') >= 0
          ramdisk_off = 4096 + ((kernel_size + 4095) // 4096 * 4096)
          assert image[ramdisk_off:ramdisk_off + 2] == b'\x1f\x8b'
          assert ramdisk_size > 0
          print(f'boot v3 verified: kernel={kernel_size}, gzip ramdisk={ramdisk_size}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fogos-boot
          path: |
            shim/out/Image
            shim/out/shim.elf
            shim/out/fogos-boot.img
          retention-days: 14

  build:
    if: ${{ inputs.shim_only != true }}
    # macos-14 (the only image with Xcode 15.x, whose iig matched the xnu-8796
    # IORPC ABI) is retired on 2026-11-02. macos-15 ships Xcode 16.0-16.4 and
    # 26.x only; the oldest Xcode is selected below and the iig output is
    # checked against the xnu-8796 IORPC ABI.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig || echo "no iig in this Xcode"

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          # On macos-15 the macOS SDK no longer carries the Kernel.framework
          # private platform headers: they come from the KDK instead.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          for hdr in \
              "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" \
              /Library/Developer/KDKs/*/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform; do
            if [ -d "$hdr" ]; then
              cp -R "$hdr"/. sdk-kernel-platform/
              echo "platform headers from $hdr"
              break
            fi
          done
          ls sdk-kernel-platform | head
          # A failed build may not have created the object tree yet: package
          # whatever exists so a partial run still gives useful output.
          cp -R sdk-kernel-platform dxb/
          paths=""
          for p in build/xnu.obj build/xnu-hdrs.obj fakeroot/usr/local/include xnu sdk-kernel-platform; do
            [ -e "dxb/$p" ] && paths="$paths $p" || true
          done
          (cd dxb && tar czf ../buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            $paths) || echo "tar reported problems"
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
